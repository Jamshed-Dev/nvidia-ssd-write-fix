<text x="34.8" y="81" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">╔════════════════════════════════════════════════════════════════════════╗</text><text x="34.8" y="100" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="60" y="100" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">NVIDIA SSD WRITE FIX</text><text x="597.6" y="100" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#767676">v2.1</text><text x="648" y="100" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="34.8" y="119" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="60" y="119" textLength="462" lengthAdjust="spacingAndGlyphs" fill="#3A96DD">Stops NVDisplay.Container.exe from wearing out your SSD</text><text x="648" y="119" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="34.8" y="138" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">╚════════════════════════════════════════════════════════════════════════╝</text><text x="34.8" y="176" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#767676">┌─</text><text x="60" y="176" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">YOUR PC</text><text x="127.2" y="176" textLength="529.2" lengthAdjust="spacingAndGlyphs" fill="#767676">──────────────────────────────────────────────────────────────┐</text><text x="34.8" y="195" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="195" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#767676">GPU</text><text x="194.4" y="195" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">NVIDIA GeForce RTX 3060</text><text x="648" y="195" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="214" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="214" textLength="50.4" lengthAdjust="spacingAndGlyp