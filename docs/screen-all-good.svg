h="117.6" height="19" fill="#16C60C"/><text x="547.2" y="271" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">NORMAL</text><text x="648" y="271" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="290" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#767676">└────────────────────────────────────────────────────────────────────────┘</text><rect x="34.8" y="314" width="621.6" height="19" fill="#16C60C"/><text x="43.2" y="328" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">●</text><text x="68.4" y="328" textLength="226.8" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">ALL GOOD - YOUR SSD IS SAFE</text><text x="60" y="347" textLength="487.2" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">Auto-protect keeps it that way, even after driver updates.</text><text x="34.8" y="385" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">WHAT WOULD YOU LIKE TO DO?</text><rect x="43.2" y="409" width="25.2" height="19" fill="#767676"/><text x="51.6" y="423" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">1</text><text x="85.2" y="423" textLength="294" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Fix now (turn off the buggy plugin)</text><text x="421.2" y="423" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#767676">~30 s, keeps your driver</text><rect x="43.2" y="428" width="25.2" height="19" fill="#767676"/><text x="51.6" y="442" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">2</text><text x="85.2" y="442" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Roll back driver to 621.01</text><text x="421.2" y="442" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#767676">clean driver, ~10 min</text><rect x="43.2" y="447" width="25.2" height="19" fill="#767676"/><text x="51.6" y="461" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">3</text><text x="85.2" y="461" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Turn off auto-protect</text><text x="421.2" y="461" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#767676">survives driver updates</text><rect x="43.2" y="466" width="25.2" height="19" fill="#767676"/><text x="51.6" y="480" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">4</text><text x="85.2" y="480" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Scan again</text><text x="421.2" y="480" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#767676">20 s</text><rect x="43.2" y="485" width="25.2" height="19" fill="#767676"/><text x="51.6" y="499" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">5</text><text x="85.2" y="499" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Long scan</text><text x="421.2" y="499" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#767676">5 min, most accurate</text><rect x="43.2" y="504" width="25.2" height="19" fill="#767676"/><text x="51.6" y="518" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">U</text><text x="85.2" y="518" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Undo all changes</text><text x="421.2" y="518" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#767676">back to NVIDIA defaults</text><text x="34.8" y="537" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">►</text><rect x="43.2" y="523" width="25.2" height="19" fill="#61D6D6"/><text x="51.6" y="537" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">Q</text><rect x="68.4" y="523" width="344.4" height="19" fill="#61D6D6"/><text x="85.2" y="537" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">Quit</text><text x="631.2" y="537" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">◄ BEST</text><text x="34.8" y="575" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#767676">↑↓ move</text><text x="110.4" y="575" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#76