<text x="34.8" y="81" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">╔════════════════════════════════════════════════════════════════════════╗</text><text x="34.8" y="100" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="60" y="100" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">NVIDIA SSD WRITE FIX</text><text x="597.6" y="100" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#767676">v2.1</text><text x="648" y="100" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="34.8" y="119" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="60" y="119" textLength="462" lengthAdjust="spacingAndGlyphs" fill="#3A96DD">Stops NVDisplay.Container.exe from wearing out your SSD</text><text x="648" y="119" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">║</text><text x="34.8" y="138" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">╚════════════════════════════════════════════════════════════════════════╝</text><text x="34.8" y="176" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">►</text><text x="51.6" y="176" textLength="453.6" lengthAdjust="spacingAndGlyphs" fill="#767676">Measuring SSD writes for 20 seconds - keep the PC idle</text><text x="34.8" y="195" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">SCANNING</text><text x="110.4" y="195" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#E74856">██████████████████████████</text><text x="337.2" y="195" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">100%</text><text x="412.8" y="195" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">0s left</text><text x="513.6" y="195" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">268.0 MB written</text><text x="34.8" y="233" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#767676">┌─</text><text x="60" y="233" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">YOUR PC</text><text x="127.2" y="233" textLength="529.2" lengthAdjust="spacingAndGlyphs" fill="#767676">──────────────────────────────────────────────────────────────┐</text><text x="34.8" y="252" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="252" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#767676">GPU</text><text x="194.4" y="252" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">NVIDIA GeForce RTX 3060</text><text x="648" y="252" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="271" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="271" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#767676">Driver</text><text x="194.4" y="271" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">621.24</text><rect x="513.6" y="257" width="117.6" height="19" fill="#C50F1F"/><text x="522" y="271" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">HAS THE BUG</text><text x="648" y="271" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="290" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="290" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#767676">Logging plugin</text><text x="194.4" y="290" textLength="277.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">_nvtopps enabled (driver default)</text><text x="648" y="290" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="309" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="309" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#767676">Auto-protect</text><text x="194.4" y="309" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Off</text><text x="648" y="309" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="328" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="328" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#767676">SSD writes</text><text x="194.4" y="328" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">47.1 GB/hour</text><text x="312" y="328" textLength="126" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">(~1,131 GB/day)</text><rect x="513.6" y="314" width="117.6" height="19" fill="#E74856"/><text x="538.8" y="328" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">TOO HIGH</text><text x="648" y="328" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="347" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#767676">└────────────────────────────────────────────────────────────────────────┘</text><rect x="34.8" y="371" width="621.6" height="19" fill="#C50F1F"/><text x="43.2" y="385" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">●</text><text x="68.4" y="385" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">YOUR SSD IS BEING WORN OUT RIGHT NOW</text><text x="60" y="404" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">Press Enter to fix it in about 30 seconds. You keep your current driver.</text><text x="34.8" y="442" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">WHAT WOULD YOU LIKE TO DO?</text><rect x="43.2" y="466" width="25.2" height="19" fill="#F9F1A5"/><text x="51.6" y="480" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">1</text><text x="85.2" y="480" textLength="294" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">Fix now (turn off the buggy plugin)</text><text x="404.4" y="480" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#767676">~30 s, keeps your driver</text><text x="614.4" y="480" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">◄ BEST</text><rect x="43.2" y="485" width="25.2" height="19" fill="#767676"/><text x="51.6" y="499" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">2</text><text x="85.2" y="499" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Roll back driver to 621.01</text><text x="404.4" y="499" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#767676">clean driver, ~10 min</text><rect x="43.2" y="504" width="25.2" height="19" fill="#767676"/><text x="51.6" y="518" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">3</text><text x="85.2" y="518" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Turn on auto-protect</text><text x="404.4" y="518" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#767676">survives driver updates</text><rect x="43.2" y="523" width="25.2" height="19" fill="#767676"/><text x="51.6" y="537" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">4</text><text x="85.2" y="537" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Scan again</text><text x="404.4" y="537" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#767676">20 s</text><rect x="43.2" y="542" width="25.2" height="19" fill="#767676"/><text x="51.6" y="556" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">5</text><text x="85.2" y="556" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Long scan</text><text x="404.4" y="556" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#767676">5 min, most accurate</text><rect x="43.2" y="561" width="25.2" height="19" fill="#767676"/><text x="51.6" y="575" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Q</text><text x="85.2" y="575" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Quit</text><text x="34.8" y="613" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">►</text><text x="51.6" y="613" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Your choice</text><text x="152.4" y="613" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#767676">(Enter = 1):</text>
