<text x="34.8" y="62" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">►</text><text x="51.6" y="62" textLength="504" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">Turning off the _nvtopps logging plugin (one registry value)</text><text x="34.8" y="81" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#61D6D6">►</text><text x="51.6" y="81" textLength="504" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">Restarting NVIDIA Display Container (the screen may flicker)</text><text x="34.8" y="100" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#16C60C">►</text><text x="51.6" y="100" textLength="520.8" lengthAdjust="spacingAndGlyphs" fill="#16C60C">Confirmed by NVIDIA's own service log: plugin no longer loaded</text><text x="34.8" y="119" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#16C60C">►</text><text x="51.6" y="119" textLength="344.4" lengthAdjust="spacingAndGlyphs" fill="#16C60C">Fix applied. Measuring again to verify...</text><text x="34.8" y="157" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">►</text><text x="51.6" y="157" textLength="453.6" lengthAdjust="spacingAndGlyphs" fill="#767676">Measuring SSD writes for 20 seconds - keep the PC idle</text><text x="34.8" y="176" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">SCANNING</text><text x="110.4" y="176" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#16C60C">██████████████████████████</text><text x="337.2" y="176" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">100%</text><text x="412.8" y="176" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">0s left</text><text x="530.4" y="176" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">0.0 MB written</text><text x="34.8" y="214" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#767676">┌─</text><text x="60" y="214" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">YOUR PC</text><text x="127.2" y="214" textLength="529.2" lengthAdjust="spacingAndGlyphs" fill="#767676">──────────────────────────────────────────────────────────────┐</text><text x="34.8" y="233" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="233" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#767676">GPU</text><text x="194.4" y="233" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">NVIDIA GeForce RTX 3060</text><text x="648" y="233" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="252" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="252" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#767676">Driver</text><text x="194.4" y="252" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">621.24</text><rect x="513.6" y="238" width="117.6" height="19" fill="#C19C00"/><text x="522" y="252" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">BUG BLOCKED</text><text x="648" y="252" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="271" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="271" textLength="117.6" lengthAdjust="spacingAndGlyphs" fill="#767676">Logging plugin</text><text x="194.4" y="271" textLength="142.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">_nvtopps disabled</text><rect x="513.6" y="257" width="117.6" height="19" fill="#16C60C"/><text x="522" y="271" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">FIX APPLIED</text><text x="648" y="271" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="290" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="290" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#767676">Auto-protect</text><text x="194.4" y="290" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Off</text><text x="648" y="290" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="309" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="309" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#767676">SSD writes</text><text x="194.4" y="309" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">0 MB/hour</text><text x="286.8" y="309" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">(~0.0 GB/day)</text><rect x="513.6" y="295" width="117.6" height="19" fill="#16C60C"/><text x="547.2" y="309" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">NORMAL</text><text x="648" y="309" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="328" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="60" y="328" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#767676">Before</text><text x="194.4" y="328" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">47.1 GB/hour</text><text x="312" y="328" textLength="126" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">(~1,131 GB/day)</text><text x="648" y="328" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#767676">│</text><text x="34.8" y="347" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#767676">└────────────────────────────────────────────────────────────────────────┘</text><rect x="34.8" y="371" width="621.6" height="19" fill="#16C60C"/><text x="43.2" y="385" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">●</text><text x="68.4" y="385" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">FIXED - YOUR SSD IS SAFE</text><text x="60" y="404" textLength="428.4" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">An NVIDIA driver update can silently undo this fix.</text><text x="60" y="423" textLength="546" lengthAdjust="spacingAndGlyphs" fill="#CCCCCC">Press Enter to turn on auto-protect, which re-applies it for you.</text><text x="34.8" y="461" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">WHAT WOULD YOU LIKE TO DO?</text><rect x="43.2" y="485" width="25.2" height="19" fill="#767676"/><text x="51.6" y="499" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">1</text><text x="85.2" y="499" textLength="294" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Fix now (turn off the buggy plugin)</text><text x="404.4" y="499" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#767676">~30 s, keeps your driver</text><rect x="43.2" y="504" width="25.2" height="19" fill="#767676"/><text x="51.6" y="518" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">2</text><text x="85.2" y="518" textLength="218.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Roll back driver to 621.01</text><text x="404.4" y="518" textLength="176.4" lengthAdjust="spacingAndGlyphs" fill="#767676">clean driver, ~10 min</text><rect x="43.2" y="523" width="25.2" height="19" fill="#F9F1A5"/><text x="51.6" y="537" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#0C0C0C">3</text><text x="85.2" y="537" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">Turn on auto-protect</text><text x="404.4" y="537" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#767676">survives driver updates</text><text x="614.4" y="537" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">◄ BEST</text><rect x="43.2" y="542" width="25.2" height="19" fill="#767676"/><text x="51.6" y="556" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">4</text><text x="85.2" y="556" textLength="84" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Scan again</text><text x="404.4" y="556" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#767676">20 s</text><rect x="43.2" y="561" width="25.2" height="19" fill="#767676"/><text x="51.6" y="575" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">5</text><text x="85.2" y="575" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Long scan</text><text x="404.4" y="575" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#767676">5 min, most accurate</text><rect x="43.2" y="580" width="25.2" height="19" fill="#767676"/><text x="51.6" y="594" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">U</text><text x="85.2" y="594" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Undo all changes</text><text x="404.4" y="594" textLength="193.2" lengthAdjust="spacingAndGlyphs" fill="#767676">back to NVIDIA defaults</text><rect x="43.2" y="599" width="25.2" height="19" fill="#767676"/><text x="51.6" y="613" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Q</text><text x="85.2" y="613" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Quit</text><text x="34.8" y="651" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#F9F1A5">►</text><text x="51.6" y="651" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#F2F2F2">Your choice</text><text x="152.4" y="651" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#767676">(Enter = 3):</text>
